name: Desktop (Tauri)

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hyperagent-desktop-linux-x86_64
            ext: AppImage
            bundle_type: appimage
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: hyperagent-desktop-macos-x86_64
            ext: dmg
            bundle_type: dmg
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: hyperagent-desktop-macos-aarch64
            ext: dmg
            bundle_type: dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: hyperagent-desktop-windows-x86_64
            ext: msi
            bundle_type: msi

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            javascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install

      - name: Build frontend (Vite + TypeScript)
        working-directory: gui
        run: pnpm build

      - name: Build Tauri desktop app
        working-directory: gui
        run: pnpm tauri build --bundles ${{ matrix.bundle_type }}

      - name: Upload desktop artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: gui/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload desktop artifact (macOS)
        if: matrix.os == 'macos-13' || matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: gui/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload desktop artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: gui/src-tauri/target/release/bundle/msi/*.msi
