name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo fmt
        run: cargo fmt --all --check
        if: matrix.os != 'windows-latest'
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo audit
        run: cargo audit
        if: matrix.os != 'windows-latest'

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hyperagent-linux
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: hyperagent-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hyperagent-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hyperagent-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build release
        run: |
          # aarch64 OOM workaround: reduce parallelism
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            export CARGO_BUILD_JOBS=2
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/hyperagent${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            target/${{ matrix.target }}/release/hyper${{ matrix.os == 'windows-latest' && '.exe' || '' }}
