name: CI

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches: [master, main]
  # Allow manual triggering
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ==============================
  # CHECK: Format + Lint + Compile
  # ==============================
  check:
    name: Check (fmt + clippy + build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.rust }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

  # ==============================
  # TEST: Unit + Integration
  # ==============================
  test:
    name: Tests (rust-${{ matrix.rust }} / ${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: windows-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.rust }}

      - name: Run tests
        run: cargo test --verbose

  # ==============================
  # BUILD RELEASE: Optimized binary
  # ==============================
  build-release:
    name: Build release (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hyper-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hyper-aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: hyper-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: hyper-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: hyper-x86_64-windows.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Install cross-compilation tools for Linux ARM
      - name: Install cross-compiler (aarch64-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build (dist profile)
        run: cargo build --profile dist --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'windows'
        run: |
          if [ -f "target/${{ matrix.target }}/dist/hyperagent" ]; then
            strip target/${{ matrix.target }}/dist/hyperagent
          fi

      - name: Rename and compress
        run: |
          cd target/${{ matrix.target }}/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv hyperagent.exe ${{ matrix.artifact }}
            7z a ../../${{ matrix.artifact }}.zip ${{ matrix.artifact }}
          else
            mv hyperagent ${{ matrix.artifact }}
            tar czf ../../${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/dist/${{ matrix.artifact }}*

  # ==============================
  # PUBLISH: Create GitHub Release
  # ==============================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          # Generate changelog from commits since last tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline --no-decorate $PREV_TAG..HEAD 2>/dev/null || echo "No changelog available")
          else
            NOTES=$(git log --oneline --no-decorate 2>/dev/null | head -20 || echo "Initial release")
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
