name: Release

on:
  push:
    tags:
      - 'v*'  # Push events matching v1.0, v2.1.3, etc.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hyperagent-linux-x86_64
            ext: tar.gz
            pkg_cmd: tar czf
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hyperagent-linux-aarch64
            ext: tar.gz
            pkg_cmd: tar czf
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: hyperagent-macos-x86_64
            ext: tar.gz
            pkg_cmd: tar czf
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: hyperagent-macos-aarch64
            ext: tar.gz
            pkg_cmd: tar czf
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: hyperagent-windows-x86_64
            ext: zip
            pkg_cmd: 7z a

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.target }}" == *-apple-* ]]; then
            strip target/${{ matrix.target }}/release/hyperagent
          elif [[ "${{ matrix.target }}" == x86_64-* ]]; then
            strip target/${{ matrix.target }}/release/hyperagent
          fi

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          ${{ matrix.pkg_cmd }} ${{ matrix.artifact_name }}.${{ matrix.ext }} hyperagent
          echo "package_name=${{ matrix.artifact_name }}.${{ matrix.ext }}" >> $GITHUB_ENV

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.artifact_name }}.${{ matrix.ext }} hyperagent.exe
          echo "package_name=${{ matrix.artifact_name }}.${{ matrix.ext }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}.${{ matrix.ext }}

  release:
    name: Create Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for f in */hyperagent-*.tar.gz */hyperagent-*.zip; do
            sha256sum "$f" >> checksums.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HyperAgent ${{ github.ref_name }}
          body: |
            ## HyperAgent ${{ github.ref_name }}

            ### CLI Installation

            ```bash
            # macOS (Apple Silicon)
            tar xzf hyperagent-macos-aarch64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper

            # macOS (Intel)
            tar xzf hyperagent-macos-x86_64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper

            # Linux (x86_64)
            tar xzf hyperagent-linux-x86_64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper

            # Linux (ARM64)
            tar xzf hyperagent-linux-aarch64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper

            # Windows (x86_64)
            # Extract hyperagent-windows-x86_64.zip and add hyperagent.exe to PATH
            ```

            ### Desktop App (Tauri GUI)

            | Platform | Download |
            |---|---|
            | Linux (x86_64) | hyperagent-desktop-linux-x86_64.AppImage |
            | macOS (Intel) | hyperagent-desktop-macos-x86_64.dmg |
            | macOS (Apple Silicon) | hyperagent-desktop-macos-aarch64.dmg |
            | Windows (x86_64) | hyperagent-desktop-windows-x86_64.msi |

            ### Checksums
            See checksums.txt in the release assets for SHA256 verification.
          files: |
            artifacts/*/hyperagent-*.tar.gz
            artifacts/*/hyperagent-*.zip
            artifacts/*/hyperagent-desktop-*.AppImage
            artifacts/*/hyperagent-desktop-*.dmg
            artifacts/*/hyperagent-desktop-*.msi
            artifacts/checksums.txt
          draft: false
          prerelease: false
