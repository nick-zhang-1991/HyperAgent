name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-gnu
          mv target/x86_64-unknown-linux-gnu/release/hyperagent hyperagent-linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HyperAgent ${{ github.ref_name }}"
          body: |
            ## HyperAgent ${{ github.ref_name }}

            ### Installation
            ```bash
            brew install nick-zhang-1991/hyperagent/hyperagent
            # or
            cargo binstall hyperagent
            # or
            cargo install hyperagent
            ```

            ### CLI Commands
            ```
            hyper run   · init · serve · analyze · swarm · ci-fix
            hyper doctor · review · memory · session · feedback
            ```

            ### What's New
            See [CHANGELOG.md](CHANGELOG.md) for full details.
          files: |
            hyperagent-linux
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
