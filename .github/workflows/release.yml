name: Release

on:
  push:
    tags:
      - 'v*'  # Push events matching v1.0, v2.1.3, etc.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hyperagent-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hyperagent-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: hyperagent-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: hyperagent-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          if [[ "${{ matrix.target }}" == *-apple-* ]]; then
            strip target/${{ matrix.target }}/release/hyperagent
          elif [[ "${{ matrix.target }}" == x86_64-* ]]; then
            strip target/${{ matrix.target }}/release/hyperagent
          fi

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf hyperagent-${{ matrix.artifact_name }}.tar.gz hyperagent
          echo "package_name=hyperagent-${{ matrix.artifact_name }}.tar.gz" >> $GITHUB_ENV

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/hyperagent-${{ matrix.artifact_name }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for f in */hyperagent-*.tar.gz; do
            sha256sum "$f" >> checksums.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HyperAgent ${{ github.ref_name }}
          body: |
            ## HyperAgent ${{ github.ref_name }}

            ### Installation

            ```bash
            # macOS (Apple Silicon)
            tar xzf hyperagent-macos-aarch64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper

            # macOS (Intel)
            tar xzf hyperagent-macos-x86_64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper

            # Linux (x86_64)
            tar xzf hyperagent-linux-x86_64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper

            # Linux (ARM64)
            tar xzf hyperagent-linux-aarch64.tar.gz
            sudo mv hyperagent /usr/local/bin/hyper
            ```

            ### Checksums
            See checksums.txt in the release assets for SHA256 verification.
          files: |
            artifacts/*/hyperagent-*.tar.gz
            artifacts/checksums.txt
          draft: false
          prerelease: false
