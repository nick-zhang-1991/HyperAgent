name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: HyperAgent Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build HyperAgent
        run: cargo build --release

      - name: Run HyperAgent Review
        id: review
        env:
          HYPER_LLM_API_KEY: ${{ secrets.HYPER_LLM_API_KEY }}
          HYPER_LLM_MODEL: ${{ vars.HYPER_LLM_MODEL || 'gpt-4o' }}
          HYPER_LLM_BASE_URL: ${{ vars.HYPER_LLM_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          # Get diff between PR branch and base
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

          # Run hyper review on the diff
          ./target/release/hyperagent review < /tmp/pr.diff > /tmp/review.md 2>/dev/null || true

          # Format for GitHub comment
          if [ -s /tmp/review.md ]; then
            echo '### 🔍 HyperAgent Code Review' > /tmp/comment.md
            echo '' >> /tmp/comment.md
            cat /tmp/review.md >> /tmp/comment.md
            echo '' >> /tmp/comment.md
            echo '---' >> /tmp/comment.md
            echo '*Automated review by [HyperAgent](https://github.com/nick-zhang-1991/HyperAgent)*' >> /tmp/comment.md
            cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post Review Comment
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            const fs = require('fs');
            let body = '### 🔍 HyperAgent Code Review\n\n';
            body += '_(Automated review generated by HyperAgent)_\n\n';
            
            try {
              const review = fs.readFileSync('/tmp/review.md', 'utf8');
              body += review.substring(0, 60000); // GitHub comment limit
            } catch (e) {
              body += '> No significant issues found. ✅';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
