<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperAgent Desktop</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #090d15; color: #e4e8ee; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(m,u,l) {
        document.getElementById('root').innerHTML = '<div style="padding:40px;color:#ef4444">JS Error: '+m+' (line '+l+')</div>';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
